<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="文档在线预览：图片预览 + 源文件（PDF）查看">
<title>文档在线查阅 · DocView</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<style>
  :root{
    --accent:#2563eb; --accent-dark:#1d4ed8;
    --ink:#1f2937; --muted:#6b7280;
    --paper:#fff; --desk:#e9ecf1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:linear-gradient(180deg,#dfe3ea 0%,var(--desk) 240px,var(--desk) 100%);
    color:var(--ink);line-height:1.6;min-height:100vh;
  }

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,.08)}
  .topbar-inner{max-width:940px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .brand .logo{width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),#60a5fa);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
  .topbar .btn-sm{font-size:13px;padding:8px 16px}

  .wrap{max-width:940px;margin:0 auto;padding:28px 20px 120px}

  /* ===== 文档信息 ===== */
  .doc-head{text-align:center;margin-bottom:22px}
  .doc-head h1{font-size:clamp(20px,4vw,28px);letter-spacing:.5px}
  .doc-head .meta{margin-top:8px;color:var(--muted);font-size:13px;
    display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .doc-head .meta span::before{content:"·";margin-right:8px;color:#c3c8d0}
  .doc-head .meta span:first-child::before{content:"";margin:0}

  .cta-row{display:flex;justify-content:center;gap:12px;margin:22px 0 30px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:10px;
    font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid transparent;
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease;font-family:inherit}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;
    box-shadow:0 6px 18px rgba(37,99,235,.35)}
  .btn-primary:hover{box-shadow:0 8px 22px rgba(37,99,235,.45)}
  .btn-ghost{background:#fff;color:var(--ink);border-color:#d6dae1}
  .btn-ghost:hover{background:#f6f8fa}

  /* ===== 纸张预览 ===== */
  .sheet{background:var(--paper);border-radius:4px;
    box-shadow:0 1px 2px rgba(15,23,42,.10),0 12px 32px rgba(15,23,42,.14);padding:14px;
    cursor:zoom-in}
  .sheet img{width:100%;display:block;border-radius:2px}
  .page-gap{height:56px}
  .page-cap{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;letter-spacing:1px}

  /* ===== 底部悬浮按钮 ===== */
  .fab-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;
    padding:14px;pointer-events:none;
    background:linear-gradient(180deg,rgba(233,236,241,0) 0%,rgba(233,236,241,.9) 60%)}
  .fab-bar .btn{pointer-events:auto;box-shadow:0 10px 30px rgba(37,99,235,.4)}

  /* ===== PDF 弹层 ===== */
  .modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(15,23,42,.72)}
  .modal.open{display:flex;flex-direction:column}
  .modal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;background:#111827;color:#fff;font-size:14px}
  .modal-bar .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-bar .acts{display:flex;gap:8px;flex:none}
  .mini{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);
    border-radius:8px;padding:7px 14px;font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit}
  .mini:hover{background:rgba(255,255,255,.22)}
  .modal-body{flex:1;min-height:0;background:#525659}
  .modal-body iframe{width:100%;height:100%;border:0;display:block}
  body.locked{overflow:hidden}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 20px 40px}
  footer .line{margin:4px 0}
  @media (max-width:560px){
    .brand small{display:none}
    .topbar .btn-sm{padding:8px 12px}
    .btn{padding:11px 18px;font-size:14px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">📄</div>
      <div>DocView 在线查阅
        <small>图片预览 · 源文件下载</small>
      </div>
    </div>
    <a class="btn btn-ghost btn-sm" href="files/transcript.pdf" download="成绩单.pdf">⬇ 下载 PDF</a>
  </div>
</header>

<main class="wrap">

  <section class="doc-head">
    <h1>《本科生成绩单》在线预览</h1>
    <div class="meta">
      <span>共 2 页</span>
      <span>格式：PDF</span>
      <span>更新：2026-08-27</span>
    </div>
  </section>

  <div class="cta-row">
    <a class="btn btn-primary" href="files/transcript.pdf" data-pdf>🔍 查看源文件（PDF）</a>
    <a class="btn btn-ghost" href="files/transcript.pdf" download="成绩单.pdf">⬇ 下载 PDF</a>
  </div>

  <figure class="sheet"><img src="assets/page-1.jpg" alt="文档第 1 页预览" loading="eager"></figure>
  <div class="page-cap">— 第 1 页 / 共 2 页 —</div>

  <div class="page-gap"></div>

  <figure class="sheet"><img src="assets/page-2.jpg" alt="文档第 2 页预览" loading="lazy"></figure>
  <div class="page-cap">— 第 2 页 / 共 2 页 —</div>

</main>

<div class="fab-bar">
  <a class="btn btn-primary" href="files/transcript.pdf" data-pdf>🔍 查看源文件（PDF）</a>
</div>

<!-- PDF 弹层 -->
<div class="modal" id="pdfModal" role="dialog" aria-modal="true" aria-label="PDF 源文件">
  <div class="modal-bar">
    <div class="title">源文件预览 · transcript.pdf</div>
    <div class="acts">
      <a class="mini" href="files/transcript.pdf" target="_blank" rel="noopener">新窗口打开</a>
      <a class="mini" href="files/transcript.pdf" download="成绩单.pdf">下载</a>
      <button class="mini" id="pdfClose" type="button">关闭 ✕</button>
    </div>
  </div>
  <div class="modal-body">
    <iframe id="pdfFrame" title="PDF 源文件" src="about:blank"></iframe>
  </div>
</div>

<footer>
  <div class="line">本页面用于文档在线查阅，点击「查看源文件」可查看 / 下载原始 PDF。</div>
  <div class="line">© 2026 DocView · Powered by GitHub Pages</div>
</footer>

<script>
(function(){
  var PDF = 'files/transcript.pdf';
  var modal = document.getElementById('pdfModal');
  var frame = document.getElementById('pdfFrame');
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  function open(){
    if (isMobile) { window.open(PDF, '_blank', 'noopener'); return; }
    if (frame.getAttribute('src') !== PDF) frame.setAttribute('src', PDF);
    modal.classList.add('open');
    document.body.classList.add('locked');
  }
  function close(){
    modal.classList.remove('open');
    document.body.classList.remove('locked');
  }

  document.querySelectorAll('[data-pdf]').forEach(function(a){
    a.addEventListener('click', function(e){
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // 允许新标签页打开
      e.preventDefault(); open();
    });
  });
  document.getElementById('pdfClose').addEventListener('click', close);
  modal.addEventListener('click', function(e){ if (e.target === modal) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });

  // 点击页面图片放大查看原图
  document.querySelectorAll('.sheet img').forEach(function(img){
    img.addEventListener('click', function(){ window.open(img.getAttribute('src'), '_blank', 'noopener'); });
  });
})();
</script>

</body>
</html>
